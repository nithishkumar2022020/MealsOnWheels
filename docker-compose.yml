services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: mow-postgres
    environment:
      POSTGRES_USER: mealsonwheels
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: highway_food_booking
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Mounted read-only so a migration cannot be edited from inside the container.
      # Not in docker-entrypoint-initdb.d: migrations are applied explicitly via
      # scripts/migrate.py so that local and production use the same code path.
      - ./backend/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealsonwheels -d highway_food_booking"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: mow-backend
    env_file: ./backend/.env
    environment:
      # Container-internal hostnames override whatever .env has for host-side runs.
      DATABASE_URL: postgresql+asyncpg://mealsonwheels:localdev@postgres:5432/highway_food_booking
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      # Redis is NOT a startup dependency: the app must run without it
      # (03_SYSTEM_ARCHITECTURE.md section 8). Listed without a condition so
      # compose still starts it, but the backend does not wait on it.
      redis:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
