<style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f8f9fa;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .pagination-dot {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .active-dot {
            width: 24px;
            background-color: #0f4c5c;
        }
        .sophisticated-card {
            border: 1px solid #D1D9DB;
            background: #F8F9FA;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .sophisticated-card:hover {
            box-shadow: 0px 4px 20px rgba(15, 76, 92, 0.08);
            transform: translateY(-2px);
        }
        .floating-ui {
            animation: floating 3s ease-in-out infinite;
        }
        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

<body class="bg-background text-on-surface flex flex-col min-h-screen">
<!-- Top AppBar (Mobile Suppression Logic: Onboarding screens often hide global nav, but I will include a simplified version for brand identity) -->

<div class="font-display-lg-mobile text-display-lg-mobile font-bold text-primary">MealsOnWheels</div>
<button class="p-2 text-on-surface-variant hover:bg-surface-container-high transition-colors rounded-full active:opacity-80 active:scale-95">
<span class="material-symbols-outlined">help_outline</span>
</button>
</header>

</div>
<!-- Floating Order Card (Bento/Modern UI Pattern) -->
<div class="absolute -bottom-4 -right-4 md:-right-8 floating-ui sophisticated-card p-base rounded-xl w-48 flex items-center gap-base">
<div class="bg-primary-container text-on-primary-container p-xs rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div>
<p class="font-label-md text-label-md text-primary m-0">Order Ready</p>
<p class="font-label-sm text-label-sm text-outline m-0">Arrival in 2m</p>
</div>
</div>
<!-- Floating Meal Preview -->
<div class="absolute -top-4 -left-4 floating-ui sophisticated-card p-xs rounded-xl w-32 overflow-hidden shadow-md" style="animation-delay: 0.5s;">
<div class="h-20 w-full rounded-lg mb-xs" data-alt="Close up high-end gourmet food plating on a dark ceramic plate. A vibrant, colorful healthy meal with fresh greens and grilled protein. The lighting is directional and dramatic, matching a corporate modern photography style. The colors are rich and saturated, with a focus on deep teal and warm amber tones." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDLHfmU1cdbJWJ8XKhKzNR-2hpMbLgDGBIEquRmDCTpg6ZwLD-owJAzXp86e7ktAEufhPIACIaSwE3tnyEoO6QJXrIEGziEyJ8Lqrj8ait40d6nK2UDB9RDk_uS3erKq1LWIYB89Xkt_t-KkQZHKI1a0kGtIgcty8gl9Z1PSP1pzRhh_FjDJUimbPoi7ew-Xpgx9ccJn7JZNZG2L7EUYFAvETYyphYEFwcCKY1N4FvKy4EB1_3JI8ifTA')">

<button class="w-full md:w-48 h-12 bg-primary text-on-primary font-label-md text-label-md rounded-lg shadow-sm hover:opacity-90 active:scale-95 transition-all order-1 md:order-2">
            Next
        </button>
<button class="w-full md:w-48 h-12 bg-surface-container-low text-on-surface-variant font-label-md text-label-md rounded-lg hover:bg-surface-container-high active:scale-95 transition-all order-2 md:order-1">
            Skip
        </button>
</footer>
<!-- Micro-interaction for buttons -->
<script>
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mousedown', () => {
                button.classList.add('scale-95');
            });
            button.addEventListener('mouseup', () => {
                button.classList.remove('scale-95');
            });
            button.addEventListener('mouseleave', () => {
                button.classList.remove('scale-95');
            });
        });
    </script>
