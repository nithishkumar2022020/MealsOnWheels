<style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }
        .route-path {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawPath 2s ease-out forwards;
        }
        @keyframes drawPath {
            to { stroke-dashoffset: 0; }
        }
        .pin-bounce {
            animation: pinBounce 2s infinite ease-in-out;
        }
        @keyframes pinBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col overflow-hidden">
<!-- Secondary Navigation: Skip Button -->
<div class="fixed top-0 left-0 w-full px-margin-mobile py-8 flex justify-end z-50">
<button class="font-label-md text-label-md text-outline hover:text-primary transition-colors duration-300">
            Skip
        </button>
</div>
<!-- Main Content Canvas (Focused Journey) -->
<main class="flex-1 flex flex-col items-center justify-center px-margin-mobile pt-16 pb-24">
<!-- Illustration Area: Bento-inspired Map Card -->
<div class="w-full max-w-md aspect-square mb-12 relative animate-fade-in" style="animation-delay: 0.2s;">
<div class="absolute inset-0 bg-surface border border-outline-variant rounded-xl overflow-hidden shadow-sm">
<!-- Map Background -->
<div class="absolute inset-0 opacity-40" data-alt="A minimalist, cool-toned silver and gray vector map of a metropolitan area. The style is editorial and sophisticated, featuring clean lines for streets and subtle blocks for buildings. The color palette is dominated by #EDF2F4 with light slate accents. The lighting is soft and even, suggesting a high-end corporate navigation interface." data-location="San Francisco" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuC1x6VWTHV_X579Qjj9fyOgEZeUod979ug_3gz32f6bv6JsekppRI4yhskpYsldwVuP6F_9K8Oxm3UQF1w2E2xZmI6cqCLAlwOCjT3JMghIK2xC_sE1_MBkiolIw0QClkHwZt65HJRRNDdgXIs4fIyn9kD42DIXnD7Vz9cl0DQuQBib2beHwYfrFeMEPZ3HpzpOuIRIPJ2cd0kDF1dyRxR_UZUg_UP2L1FYGeNGTCrYoZa8DyJhQZBEMA')">
</div>
<!-- Animated Route Overlay -->
<svg class="absolute inset-0 w-full h-full pointer-events-none" viewbox="0 0 400 400">
<path class="route-path" d="M 50,350 C 100,300 150,320 200,200 S 300,100 350,50" fill="none" stroke="#fd7729" stroke-linecap="round" stroke-width="4"></path>
<!-- Restaurant Pins -->
<g class="pin-bounce" style="animation-delay: 0.5s;">
<circle cx="160" cy="240" fill="#003441" r="12"></circle>
<text fill="white" font-family="Material Symbols Outlined" font-size="16" text-anchor="middle" x="160" y="244">restaurant</text>
</g>
<g class="pin-bounce" style="animation-delay: 0.8s;">
<circle cx="230" cy="170" fill="#003441" r="12"></circle>
<text fill="white" font-family="Material Symbols Outlined" font-size="16" text-anchor="middle" x="230" y="174">local_pizza</text>
</g>
<g class="pin-bounce" style="animation-delay: 1.1s;">
<circle cx="310" cy="90" fill="#003441" r="12"></circle>
<text fill="white" font-family="Material Symbols Outlined" font-size="16" text-anchor="middle" x="310" y="94">bakery_dining</text>
</g>
</svg>
<!-- Floating Route Indicator -->
<div class="absolute bottom-4 left-4 right-4 bg-surface-container-lowest/90 backdrop-blur-md p-4 rounded-lg border border-outline-variant flex items-center gap-3">
<div class="w-10 h-10 bg-primary-container rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary-container" style="font-size: 20px;">route</span>
</div>
<div>
<p class="font-label-sm text-label-sm text-outline">Current Route</p>
<p class="font-label-md text-label-md text-primary">Downtown Express • 12:30 PM</p>
</div>
</div>
</div>
</div>
<!-- Copy Content -->

                Search restaurants along your route

<p class="font-body-md text-body-md text-on-surface-variant px-4">

                Next
                <span class="material-symbols-outlined" style="font-size: 18px;">arrow_forward</span>
</button>
</div>
</footer>
<!-- Interactive micro-effects script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Subtle parallax effect on the map card
            const card = document.querySelector('.animate-fade-in');
            document.addEventListener('mousemove', (e) => {
                const xAxis = (window.innerWidth / 2 - e.pageX) / 50;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 50;
                card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            });
        });
    </script>
