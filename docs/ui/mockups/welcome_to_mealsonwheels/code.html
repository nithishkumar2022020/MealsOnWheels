                  "secondary-container": "#fd7729",

                  "on-secondary-fixed": "#351000",
                  "inverse-primary": "#9acee1",
                  "on-background": "#191c1d",

<style>
    body {
      background-color: #f8f9fa;
      color: #191c1d;
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .gradient-overlay {
      background: linear-gradient(180deg, rgba(248, 249, 250, 0) 0%, rgba(248, 249, 250, 1) 100%);
    }

    @keyframes subtle-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .animate-float {
      animation: subtle-float 6s ease-in-out infinite;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-0 m-0">
<!-- Main Canvas -->
<main class="relative w-full max-w-md mx-auto min-h-screen flex flex-col bg-surface overflow-hidden shadow-2xl md:shadow-none">
<!-- Illustration Section -->
<div class="relative w-full h-[60vh] flex flex-col items-center justify-center overflow-hidden">
<!-- Background Ambient Gradient -->
<div class="absolute inset-0 bg-gradient-to-b from-[#ffdbcc] via-[#f8f9fa] to-surface opacity-40"></div>
<!-- Sunset Sky Circle -->
<div class="absolute top-12 w-64 h-64 rounded-full bg-secondary-container blur-3xl opacity-20"></div>
<!-- Illustration Container -->
<div class="relative z-10 w-full px-8 flex flex-col items-center">
<div class="w-full aspect-square relative animate-float">
<div class="absolute inset-0 rounded-full border border-outline-variant/30 scale-110"></div>
<div class="absolute inset-0 rounded-full border border-outline-variant/20 scale-125"></div>
<!-- Image Placeholder for Illustration -->
<img class="w-full h-full object-contain relative z-20" data-alt="A sophisticated minimalist vector illustration of a clean modern highway stretching toward a sleek architectural restaurant on the horizon. The sky is a warm sunset amber and soft teal gradient, reflecting the brand's primary and secondary colors. The art style is modern corporate editorial, featuring clean lines, large areas of negative space, and a high-end travel aesthetic. The lighting is soft and golden, evoking a calm and efficient transit experience." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBq_uo-7RzlTuMDisxtBdjoSyn7hCO5gZNNIhWRmrQV9NbUdk4xGyFl-a1A-6itRkvGTORxqEuIz5xwIsQv2WQAxdZq4Sp7vN4zm9XK7KFkFP0p-iy1j0Gv8NSaGNuhGns3vQlRfj9EmdNoVcuCkwg93I-5-v9qkAO-M4BZ8lmB80UVTPjvJccyNHIrDQ308l-teVF1JGy9SMJxdydjn5rwoSbSf63G8r9PPg1F5uh7L8Okem4P71ZmvQ"/>
</div>
</div>
<!-- Fade to Content -->
<div class="absolute bottom-0 left-0 right-0 h-32 gradient-overlay z-30"></div>
</div>
<!-- Content Section -->
<div class="relative z-40 px-margin-mobile pb-12 flex-1 flex flex-col justify-between -mt-12">
<div class="text-center space-y-4">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-tight">
          Welcome to <span class="block">MealsOnWheels</span>
</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px] mx-auto">
          Book meals while traveling
        </p>
</div>
<!-- Action Cluster -->
<div class="flex flex-col gap-4 mt-12">
<!-- Primary Button -->
<button class="w-full h-[48px] bg-primary text-on-primary font-label-md text-label-md rounded-2xl shadow-lg hover:opacity-90 active:scale-95 transition-all flex items-center justify-center gap-2 group">
          Get started
          <span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<!-- Secondary/Login Link -->
<div class="text-center">
<a class="inline-block py-2 font-label-sm text-label-sm text-outline hover:text-on-surface transition-colors" href="#">
            Already have an account? <span class="text-primary font-bold">Log in</span>
</a>
</div>
</div>
<!-- Minimalist Branding Mark -->
<div class="flex justify-center mt-8">
<div class="flex items-center gap-2 opacity-30">
<div class="w-1.5 h-1.5 rounded-full bg-primary"></div>
<div class="w-8 h-px bg-outline-variant"></div>
<div class="w-1.5 h-1.5 rounded-full bg-primary"></div>
</div>
</div>
</div>
<!-- Background Decoration -->
<div class="absolute -bottom-24 -left-24 w-64 h-64 bg-primary-fixed rounded-full blur-[80px] opacity-10"></div>
<div class="absolute -top-12 -right-12 w-48 h-48 bg-secondary-fixed rounded-full blur-[60px] opacity-10"></div>
</main>
<script>
    // Micro-interaction for the button
    document.querySelector('button').addEventListener('mousedown', function() {
      this.classList.add('scale-95');
    });
    document.querySelector('button').addEventListener('mouseup', function() {
      this.classList.remove('scale-95');
    });
    document.querySelector('button').addEventListener('mouseleave', function() {
      this.classList.remove('scale-95');
    });
  </script>
</body></html>
