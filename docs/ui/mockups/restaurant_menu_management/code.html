<span class="material-symbols-outlined">add_circle</span>

<!-- Micro-interaction for Toggles -->
<script>
        document.querySelectorAll('input[type="checkbox"]').forEach(toggle => {
            toggle.addEventListener('change', function() {
                const card = this.closest('.bg-surface-container-lowest');
                if(!this.checked) {
                    card.classList.add('opacity-60');
                    card.classList.add('grayscale-[0.5]');
                } else {
                    card.classList.remove('opacity-60');
                    card.classList.remove('grayscale-[0.5]');
                }
            });
        });

        // Tab Switching Logic (Simulated)
        const tabs = document.querySelectorAll('nav button');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => {
                    t.className = "flex flex-col items-center justify-center text-secondary hover:bg-surface-container-highest rounded-full px-6 py-2 transition-all active:scale-90 duration-150 shrink-0";
                });
                if(!tab.querySelector('.material-symbols-outlined')) {
                    tab.className = "flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-6 py-2 transition-all active:scale-90 duration-150 shrink-0";
                }
            });
        });
    </script>
