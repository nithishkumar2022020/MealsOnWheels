<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .fill-icon {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Flowing effect for progress line */
        @keyframes flowing-glow {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .status-line-gradient {
            background: linear-gradient(90deg, #b7122a 0%, #ffb3b1 50%, #b7122a 100%);
            background-size: 200% 100%;
            animation: flowing-glow 3s linear infinite;
        }

        /* Gentle bounce for active status icon */
        @keyframes gentle-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .animate-gentle-bounce {
            animation: gentle-bounce 2s ease-in-out infinite;
        }

        /* Pulse animation for map marker */
        @keyframes marker-pulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0; }
        }
        .marker-pulse-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: #b7122a;
            animation: marker-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        /* Ripple effect for button */
        .ripple {
            position: relative;
            overflow: hidden;
        }
        .ripple-effect {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0);
            animation: ripple-animation 0.6s linear;
            pointer-events: none;
        }
        @keyframes ripple-animation {
            to { transform: scale(4); opacity: 0; }
        }

        /* Slide in animation for profile card */
        @keyframes slide-up {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-up {
            animation: slide-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .interactive-card:active {
            transform: scale(0.98);
        }
    </style>

<script>
    // Ripple effect implementation
    function createRipple(event) {
        const button = event.currentTarget;
        const circle = document.createElement("span");
        const diameter = Math.max(button.clientWidth, button.clientHeight);
        const radius = diameter / 2;

        circle.style.width = circle.style.height = `${diameter}px`;
        circle.style.left = `${event.clientX - button.getBoundingClientRect().left - radius}px`;
        circle.style.top = `${event.clientY - button.getBoundingClientRect().top - radius}px`;
        circle.classList.add("ripple-effect");

        const ripple = button.getElementsByClassName("ripple-effect")[0];
        if (ripple) {
            ripple.remove();
        }

        button.appendChild(circle);
    }

    const callBtn = document.getElementById('call-rider-btn');
    if (callBtn) {
        callBtn.addEventListener('click', (e) => {
            createRipple(e);
            
            // Reusing existing micro-interaction logic
            const originalContent = callBtn.innerHTML;
            callBtn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="autorenew">autorenew</span><span class="font-label-md text-label-md">Connecting...</span>';
            setTimeout(() => {
                callBtn.innerHTML = '<span class="material-symbols-outlined fill-icon" style="font-variation-settings: \'FILL\' 1;" data-icon="call">call</span><span class="font-label-md text-label-md">Calling...</span>';
            }, 1500);
        });
    }

    // Micro-interaction: Update progress bar width on load
    window.addEventListener('DOMContentLoaded', () => {
        const progressLine = document.querySelector('.status-line-gradient');
        if (progressLine) {
            progressLine.style.width = '0%';
            setTimeout(() => {
                progressLine.style.width = '75%';
            }, 300);
        }
    });
</script>
