<style>

            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .highway-dash {
            stroke-dasharray: 20;
            animation: dashmove 2s linear infinite;
        }
        @keyframes dashmove {
            to { stroke-dashoffset: -40; }
        }

    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopAppBar (Shared Component) -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface-dim border-b border-outline-variant dark:border-outline flex items-center justify-between px-margin-mobile h-12 w-full">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed" style="font-size: 24px;">restaurant</span>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed">MealsOnWheels</h1>
</div>
<div class="flex items-center">
<button class="p-2 hover:bg-surface-container-high transition-colors active:scale-95 transition-transform rounded-full">
<span class="material-symbols-outlined text-on-surface-variant dark:text-surface-variant">location_on</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center pt-12 pb-16 px-margin-mobile">
<!-- Bento-style Container for Empty State -->
<div class="max-w-xl w-full flex flex-col items-center text-center">
<!-- Minimalist 2-color Illustration (Custom SVG with Animation) -->
<div class="w-full max-w-sm mb-lg">
<svg class="w-full h-auto opacity-90" fill="none" viewbox="0 0 400 240" xmlns="http://www.w3.org/2000/svg">
<!-- Sky/Background -->
<rect fill="#EDF2F4" height="240" rx="24" width="400"></rect>
<!-- The Highway -->
<path d="M50 240L160 80H240L350 240H50Z" fill="#003441"></path>
<!-- Animated Road Lines -->
<line class="highway-dash" stroke="#9acee1" stroke-linecap="round" stroke-width="4" x1="200" x2="200" y1="90" y2="230"></line>
<!-- Minimalist Distant Mountains -->
<path d="M0 100L80 40L160 100H0Z" fill="#D1D9DB" opacity="0.5"></path>
<path d="M240 100L320 60L400 100H240Z" fill="#D1D9DB" opacity="0.3"></path>
<!-- Roadside Sign -->
<rect fill="#D1D9DB" height="30" rx="4" width="40" x="280" y="140"></rect>
<rect fill="#70787c" height="20" width="4" x="298" y="170"></rect>
</svg>
</div>
<!-- Typography Content -->
<div class="space-y-base">
<h2 class="font-headline-md text-headline-md font-bold text-primary">No restaurants found</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md mx-auto">No restaurants are accepting orders for this route at this time.</p>
<div class="pt-base">
<span class="font-label-md text-label-md text-outline px-4 py-1.5 bg-surface-container rounded-full inline-block">
                        Try selecting a different time or route.
                    </span>
</div>
</div>
<!-- Action Cluster -->
<div class="mt-lg w-full flex flex-col gap-sm md:flex-row md:justify-center items-stretch">
<!-- Primary Action -->
<button class="bg-primary text-on-primary h-[48px] px-xl rounded-lg font-label-md text-label-md shadow-lg hover:brightness-110 active:scale-95 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined">route</span>
                    Search another route
                </button>
<!-- Secondary Action -->
<button class="bg-secondary-container text-on-secondary-container h-[48px] px-md rounded-lg font-label-md text-label-md hover:brightness-105 active:scale-95 transition-all flex items-center justify-center">
                    Browse all restaurants
                </button>
</div>
<!-- Footer Link -->
<button class="mt-md font-label-md text-label-md text-primary flex items-center gap-1 hover:underline active:scale-95 transition-all">
<span class="material-symbols-outlined" style="font-size: 18px;">notifications</span>
                Set a reminder to search later?
            </button>
</div>
<!-- Optional Subtle Background Interaction -->
<div class="fixed inset-0 pointer-events-none -z-10 opacity-20 overflow-hidden">
<!-- Asymmetric decorative elements typical of modern corporate UI -->
<div class="absolute -top-24 -left-24 w-96 h-96 bg-primary-fixed-dim rounded-full blur-[100px]"></div>
<div class="absolute -bottom-48 -right-48 w-[500px] h-[500px] bg-secondary-fixed-dim rounded-full blur-[120px]"></div>
</div>
</main>
<!-- BottomNavBar (Shared Component) -->
<!-- Determined active tab: "Home" or "Stops" depending on intent. 
         Since user searched and failed, "Home" or "Stops" are closest. 
         We'll assume user is in a Search flow originating from "Stops". -->
<nav class="fixed bottom-0 w-full z-50 bg-surface dark:bg-surface-dim shadow-[0px_-4px_20px_rgba(0,52,65,0.08)] flex justify-around items-center h-16 w-full px-2">
<!-- Home -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-1 hover:bg-surface-container-highest transition-colors active:scale-95 transition-transform">
<span class="material-symbols-outlined">home</span>
<span class="font-label-sm text-label-sm-mobile">Home</span>
</button>
<!-- Stops (Active) -->

<span class="material-symbols-outlined">departure_board</span>
<span class="font-label-sm text-label-sm-mobile">Stops</span>
</button>
<!-- Orders -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-1 hover:bg-surface-container-highest transition-colors active:scale-95 transition-transform">
<span class="material-symbols-outlined">receipt_long</span>
<span class="font-label-sm text-label-sm-mobile">Orders</span>
</button>
<!-- Profile -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-1 hover:bg-surface-container-highest transition-colors active:scale-95 transition-transform">
<span class="material-symbols-outlined">person</span>
<span class="font-label-sm text-label-sm-mobile">Profile</span>
</button>
</nav>
<script>
        // Micro-interaction for the "Set reminder" link
        document.querySelector('.text-primary.flex.items-center').addEventListener('click', function() {
            const btn = this;
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined" style="font-size: 18px;">check</span> Reminder set!';
            btn.classList.add('text-secondary');
            setTimeout(() => {
                btn.innerHTML = originalHtml;
                btn.classList.remove('text-secondary');
            }, 2000);
        });

        // Simple button hover effects beyond tailwind classes
        const buttons = document.querySelectorAll('button');
        buttons.forEach(btn => {
            btn.addEventListener('mouseenter', () => {
                btn.style.boxShadow = '0px 8px 30px rgba(0, 52, 65, 0.12)';
            });
            btn.addEventListener('mouseleave', () => {
                btn.style.boxShadow = '';
            });
        });
    </script>
