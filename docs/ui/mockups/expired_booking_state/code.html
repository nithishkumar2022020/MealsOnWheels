<body class="bg-background text-on-background font-body-md selection:bg-primary-fixed-dim">
<!-- Top App Bar (Suppressing global nav as per "Task-Focused" rule) -->
<header class="w-full top-0 sticky bg-surface shadow-sm z-50 flex justify-between items-center px-margin-mobile md:px-margin-desktop h-12">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" data-icon="directions_bus">directions_bus</span>
<h1 class="font-headline-sm text-headline-sm-mobile md:text-headline-sm font-extrabold text-primary tracking-tight">TransitFood</h1>
</div>
<button aria-label="Close" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant/20 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="close">close</span>
</button>
</header>
<main class="min-h-[calc(100vh-48px)] flex flex-col items-center justify-center px-container-margin py-8">
<!-- Warning Section -->
<div class="w-full max-w-md text-center flex flex-col items-center gap-6 animate-pop-in">
<!-- Large Icon Container -->
<div class="relative w-24 h-24 flex items-center justify-center bg-error-container rounded-full mb-2 shadow-sm">
<span class="material-symbols-outlined text-error !text-6xl" data-icon="schedule">schedule</span>
<div class="absolute -bottom-1 -right-1 bg-surface-container-lowest border-4 border-background rounded-full p-1 flex items-center justify-center">
<span class="material-symbols-outlined text-error !text-2xl font-bold" data-icon="close">close</span>
</div>
</div>
<!-- Typography -->
<div class="space-y-2">
<h2 class="font-headline-xl text-headline-xl text-on-background">Order slot expired</h2>
<p class="font-body-lg text-body-lg text-secondary max-w-[280px] mx-auto leading-tight">
                    The cutoff time for this restaurant was <span class="font-bold text-primary">2 minutes ago</span>.
                </p>
</div>
<!-- Info Box: Original Booking Details (Bento-style card) -->
<div class="w-full glass-panel rounded-xl p-card-padding text-left space-y-4 shadow-[0px_4px_20px_rgba(0,0,0,0.06)]">
<div class="flex justify-between items-start">
<h3 class="font-label-md text-label-md text-secondary uppercase tracking-widest">Original Details</h3>
<span class="bg-surface-container-high px-2 py-1 rounded text-[10px] font-bold text-outline uppercase">Expired</span>
</div>
<div class="grid grid-cols-1 gap-4">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-lg bg-surface-container overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A high-end restaurant kitchen interior with warm ambient lighting and chefs preparing authentic Indian cuisine. The setting is modern yet cozy, featuring clean white surfaces and stainless steel accents. A vibrant, high-contrast light mode UI vibe persists throughout the image." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBSxytuqyIH2JW7UTIJOE9QcnhOffSpAATXY526JmoxI4jLUsBBuu3sLRCIWGUmQFa3wL_95OTYQca9T-OmQQkt7-gTD0iNRsYDCTCV4hrNQLLLbDZ6v5OR0pmH7sPPo9L4je8JpRpCardoRqGWq9rl8WIG7DveCcyhlylsGVAq-0A3VsVcRRmqvi9jXFFt0NLj7e8QQbON7Zq98Qw6yrdA3QNtk5kATd2PCEbPGspAgHGqbSA0Ddu5Xg"/>
</div>
<div>
<p class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Urban Spice Kitchen</p>
<p class="font-label-sm text-label-sm text-secondary">Railway Station East Wing</p>
</div>
</div>
<div class="h-px bg-outline-variant/30 w-full"></div>
<div class="grid grid-cols-2 gap-2">
<div class="flex flex-col gap-1">
<span class="text-[10px] text-secondary font-bold uppercase">Time</span>
<div class="flex items-center gap-1">
<span class="material-symbols-outlined !text-sm text-primary" data-icon="history">history</span>
<span class="font-body-md text-body-md">Pickup: 1:30 PM</span>
</div>
</div>
<div class="flex flex-col gap-1">
<span class="text-[10px] text-secondary font-bold uppercase">Items</span>
<div class="flex items-center gap-1">
<span class="material-symbols-outlined !text-sm text-primary" data-icon="restaurant_menu">restaurant_menu</span>
<span class="font-body-md text-body-md">2x Paneer Kulcha</span>
</div>
</div>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="w-full flex flex-col gap-3 mt-4">
<button class="w-full h-[56px] bg-primary text-on-primary font-bold rounded-xl shadow-md active:scale-95 transition-transform flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="search">search</span>
                    Search different time
                </button>
<button class="w-full h-[56px] border-2 border-secondary text-secondary font-bold rounded-xl active:scale-95 transition-transform flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="restaurant">restaurant</span>
                    Browse other restaurants
                </button>
</div>
<!-- Save for later checkbox -->
<div class="flex items-center gap-3 mt-4 py-2 px-4 rounded-full bg-surface-container-low border border-outline-variant/20">
<label class="relative flex items-center cursor-pointer">
<input class="peer h-5 w-5 cursor-pointer appearance-none rounded border border-outline transition-all checked:bg-primary checked:border-primary" type="checkbox"/>
<span class="absolute text-white opacity-0 peer-checked:opacity-100 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2">
<span class="material-symbols-outlined !text-sm" data-icon="check">check</span>
</span>
</label>
<span class="font-label-md text-label-md text-on-surface-variant">Save order for later?</span>
</div>
</div>
</main>
<!-- Visual Polish: Decorative background elements -->
<div class="fixed top-0 left-0 w-full h-full -z-10 opacity-30 pointer-events-none">
<div class="absolute top-10 left-10 w-64 h-64 bg-primary-container/20 rounded-full blur-[80px]"></div>
<div class="absolute bottom-20 right-10 w-96 h-96 bg-tertiary-container/10 rounded-full blur-[100px]"></div>
</div>
<script>
        // Simple micro-interaction for the checkbox
        document.querySelector('input[type="checkbox"]').addEventListener('change', function(e) {
            if(this.checked) {
                const feedback = document.createElement('div');
                feedback.className = 'fixed bottom-20 left-1/2 -translate-x-1/2 bg-inverse-surface text-inverse-on-surface px-6 py-3 rounded-full text-sm font-bold shadow-lg animate-bounce z-[60]';
                feedback.innerText = 'Order details saved to your profile';
                document.body.appendChild(feedback);
                setTimeout(() => feedback.remove(), 2500);
            }
        });
    </script>
</body></html>
