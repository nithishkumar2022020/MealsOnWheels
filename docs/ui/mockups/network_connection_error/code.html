<body class="bg-background text-on-background font-body-md selection:bg-primary-fixed selection:text-on-primary-fixed overflow-hidden">
<!-- Top App Bar (Suppressing actual shell for focused task, but keeping brand identity) -->
<header class="w-full top-0 sticky bg-surface flex justify-between items-center px-margin-mobile md:px-margin-desktop h-12 w-full z-50">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" data-icon="directions_bus">directions_bus</span>
<span class="font-display-lg-mobile text-display-lg-mobile md:text-headline-sm text-primary tracking-tight font-bold">TransitFood</span>
</div>
<div class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant/20 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="close">close</span>
</div>
</header>
<main class="relative min-h-[calc(100vh-48px)] flex flex-col items-center justify-center px-container-margin py-32 overflow-hidden">
<!-- Subtle Animated Background Element -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-30">
<div class="absolute top-1/4 -left-20 w-64 h-64 bg-primary-fixed blur-[100px] rounded-full"></div>
<div class="absolute bottom-1/4 -right-20 w-80 h-80 bg-tertiary-fixed-dim blur-[120px] rounded-full"></div>
</div>
<div class="z-10 w-full max-w-lg flex flex-col items-center text-center">
<!-- Hero Illustration/Icon Section -->
<div class="relative mb-12 animate-float">
<!-- Large Cloud with X - Using Material Symbols with custom styling -->
<div class="relative flex items-center justify-center">
<span class="material-symbols-outlined text-[120px] text-surface-variant dark:text-outline-variant" data-icon="cloud_off" style="font-variation-settings: 'opsz' 48, 'wght' 200;">cloud_off</span>
<!-- Decorative Disconnected Cables / Elements -->
<div class="absolute -bottom-4 flex gap-4">
<div class="h-2 w-12 bg-outline-variant rounded-full rotate-12"></div>
<div class="h-2 w-8 bg-outline-variant rounded-full -rotate-45"></div>
</div>
<!-- Error Badge -->
<div class="absolute top-0 right-0 transform translate-x-1/4 -translate-y-1/4">
<div class="bg-error w-10 h-10 rounded-full flex items-center justify-center shadow-lg border-4 border-white">
<span class="material-symbols-outlined text-on-error text-xl font-bold" data-icon="close">close</span>
</div>
</div>
</div>
</div>
<!-- Content Section -->
<div class="space-y-4 mb-12">
<h1 class="font-headline-xl text-headline-xl text-on-surface leading-tight">
                    Can't find restaurants
                </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md mx-auto">
                    We're having trouble connecting. Please check your internet and try again.
                </p>
</div>
<!-- Action Cluster -->
<div class="flex flex-col gap-4 w-full sm:flex-row sm:justify-center">
<button class="h-[56px] px-8 bg-primary text-on-primary font-bold rounded-xl shadow-md hover:shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2 min-w-[200px]" onclick="location.reload()">
<span class="material-symbols-outlined" data-icon="refresh">refresh</span>
                    Try again
                </button>
<button class="h-[56px] px-8 bg-secondary-container text-on-secondary-container font-semibold rounded-xl border-2 border-transparent hover:border-outline-variant active:scale-95 transition-all flex items-center justify-center gap-2 min-w-[160px]">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
                    Go back
                </button>
</div>
<!-- Troubleshooting List (Progress Stepper style but for guidance) -->
<div class="mt-16 w-full max-w-sm glass-card rounded-2xl p-6 text-left">
<h3 class="font-label-md text-label-md text-on-surface mb-4 uppercase tracking-wider opacity-60">Quick Checks</h3>
<ul class="space-y-4">
<li class="flex items-start gap-4">
<div class="w-6 h-6 rounded-full bg-secondary-fixed flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-[16px] text-secondary" data-icon="wifi">wifi</span>
</div>
<span class="text-body-md text-on-surface-variant">Check your Wi-Fi or cellular data.</span>
</li>
<li class="flex items-start gap-4">
<div class="w-6 h-6 rounded-full bg-secondary-fixed flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-[16px] text-secondary" data-icon="flight">flight</span>
</div>
<span class="text-body-md text-on-surface-variant">Make sure Airplane Mode is off.</span>
</li>
</ul>
</div>
</div>
<!-- System Error Message at bottom -->
<footer class="absolute bottom-8 w-full text-center px-4">
<code class="text-label-sm font-label-sm text-secondary bg-surface-container px-3 py-1 rounded-full opacity-60">
                Error: Failed to connect to Nominatim
            </code>
</footer>
</main>
<script>
        // Micro-interaction for the 'Try again' button pulse
        const tryAgainBtn = document.querySelector('button');
        if (tryAgainBtn) {
            tryAgainBtn.addEventListener('mouseenter', () => {
                tryAgainBtn.classList.add('animate-pulse-slow');
            });
            tryAgainBtn.addEventListener('mouseleave', () => {
                tryAgainBtn.classList.remove('animate-pulse-slow');
            });
        }

        // Simulating a connectivity check logic
        window.addEventListener('online', () => {
            console.log('User is back online');
            // In a real app, we might automatically retry here
        });
    </script>
