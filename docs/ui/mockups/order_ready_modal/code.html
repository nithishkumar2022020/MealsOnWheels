<style>
        body { font-family: 'Montserrat', sans-serif; }

<body class="bg-background text-on-surface overflow-hidden h-screen w-full relative">

<div>

</div>

                    </div>
</div>

                </p>

<button class="w-full flex items-center justify-center gap-2 border-2 border-primary text-primary h-[56px] rounded-xl font-label-md text-label-md hover:bg-surface-variant transition-all active:scale-95">

                    Call restaurant
                </button>
</div>

<div class="mt-lg pt-base w-full border-t border-outline-variant/30 flex justify-center">
<p class="font-label-sm text-label-sm text-on-surface-variant">Ref: #USK-2940-ND</p>
</div>
</div>

<!-- Micro-interactions Script -->
<script>
        // Simple Countdown Timer Logic
        let time = 15 * 60; // 15 minutes in seconds
        const timerElement = document.getElementById('timer');

        function updateTimer() {
            const minutes = Math.floor(time / 60);
            const seconds = time % 60;
            timerElement.textContent = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
            if (time > 0) time--;
        }

        setInterval(updateTimer, 1000);

        // Micro-interaction for primary button
        const primaryBtn = document.querySelector('button.bg-primary');
        primaryBtn.addEventListener('click', () => {
            primaryBtn.innerHTML = '<span class="flex items-center gap-2">Processing...</span>';
            setTimeout(() => {
                primaryBtn.innerHTML = 'Confirmed';
                primaryBtn.classList.replace('bg-primary', 'bg-secondary-container');
                primaryBtn.classList.add('text-on-secondary-container');
            }, 1000);
        });
    </script>
