<style>
        .custom-shadow {
            box-shadow: 0px 4px 20px rgba(226, 55, 68, 0.08);
        }
        .travel-option-input:checked + .travel-option-card {
            border-color: #e23744;
            background-color: #fcecee;
        }
        .travel-option-input:checked + .travel-option-card .travel-option-icon {
            color: #e23744;
            font-variation-settings: 'FILL' 1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased">
<!-- TopAppBar -->
<header class="w-full top-0 bg-surface shadow-sm sticky z-40">
<div class="flex justify-between items-center px-margin-mobile md:px-margin-desktop h-12 w-full">
<button class="text-on-surface-variant hover:bg-surface-variant transition-colors active:scale-95 duration-150 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="font-headline-md text-headline-md text-on-surface tracking-tight">
                TransitFood
            </div>
<div class="w-10"></div> <!-- Placeholder for balance -->
</div>
<div class="h-px w-full bg-surface-container"></div>
</header>
<!-- Main Content -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile md:px-margin-desktop py-lg">
<div class="w-full max-w-2xl mx-auto space-y-lg">
<div class="text-center space-y-sm">
<h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-on-surface">How are you traveling today?</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-md mx-auto">This filters restaurants based on accessibility and parking.</p>
</div>
<form class="space-y-md">
<!-- Option 1: Bus -->
<label class="block cursor-pointer group">
<input checked="" class="travel-option-input sr-only" name="travel_type" type="radio" value="bus"/>
<div class="travel-option-card flex items-center p-md bg-surface border border-surface-variant rounded-xl transition-all duration-200 hover:custom-shadow">
<div class="flex-shrink-0 mr-md">
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant group-hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-4xl travel-option-icon" style="font-variation-settings: 'FILL' 1;">directions_bus</span>
</div>
</div>
<div class="flex-grow">
<h3 class="font-headline-sm text-headline-sm text-on-surface">Bus Boarding Point</h3>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Select if you are catching a bus at a stop</p>
</div>
</div>
</label>
<!-- Option 2: Self-drive Dine-in -->
<label class="block cursor-pointer group">
<input class="travel-option-input sr-only" name="travel_type" type="radio" value="drive_dine"/>
<div class="travel-option-card flex items-center p-md bg-surface border border-surface-variant rounded-xl transition-all duration-200 hover:custom-shadow">
<div class="flex-shrink-0 mr-md">
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant group-hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-4xl travel-option-icon">restaurant</span>
</div>
</div>
<div class="flex-grow">
<h3 class="font-headline-sm text-headline-sm text-on-surface">Self-drive: Dine-in</h3>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Select if you are driving and want to eat at the restaurant</p>
</div>
</div>
</label>
<!-- Option 3: Self-drive Takeaway -->
<label class="block cursor-pointer group">
<input class="travel-option-input sr-only" name="travel_type" type="radio" value="drive_takeaway"/>
<div class="travel-option-card flex items-center p-md bg-surface border border-surface-variant rounded-xl transition-all duration-200 hover:custom-shadow">
<div class="flex-shrink-0 mr-md">
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant group-hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-4xl travel-option-icon">takeout_dining</span>
</div>
</div>
<div class="flex-grow">
<h3 class="font-headline-sm text-headline-sm text-on-surface">Self-drive: Takeaway</h3>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Select if you are driving and want a quick pickup</p>
</div>
</div>
</label>
<div class="pt-md">
<button class="w-full h-12 bg-primary text-on-primary font-label-md text-label-md rounded-lg flex items-center justify-center hover:bg-opacity-90 transition-colors active:scale-95 duration-150 custom-shadow" type="button">
                        Continue
                    </button>
</div>
</form>
</div>
</main>
</body></html>
