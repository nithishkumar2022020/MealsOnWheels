<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Montserrat:wght@700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed-variant": "#633f00",
                        "error": "#ba1a1a",
                        "on-primary-fixed": "#410007",
                        "surface-variant": "#e2e2e2",
                        "surface-container-high": "#e8e8e8",
                        "primary-fixed-dim": "#ffb3b1",
                        "on-secondary-fixed": "#1b1c1c",
                        "background": "#f9f9f9",
                        "on-primary-container": "#fffbff",
                        "on-secondary-container": "#656464",
                        "surface-tint": "#bb162c",
                        "secondary-fixed": "#e4e2e1",
                        "inverse-primary": "#ffb3b1",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed": "#291800",
                        "tertiary": "#805200",
                        "outline": "#8f6f6e",
                        "on-background": "#1a1c1c",
                        "surface-container": "#eeeeee",
                        "surface-bright": "#f9f9f9",
                        "surface-dim": "#dadada",
                        "on-primary-fixed-variant": "#92001c",
                        "error-container": "#ffdad6",
                        "inverse-on-surface": "#f1f1f1",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed-dim": "#c8c6c6",
                        "on-surface-variant": "#5b403f",
                        "surface-container-low": "#f3f3f3",
                        "inverse-surface": "#2f3131",
                        "surface-container-highest": "#e2e2e2",
                        "primary-fixed": "#ffdad8",
                        "tertiary-fixed-dim": "#ffb954",
                        "primary": "#b7122a",
                        "primary-container": "#db313f",
                        "on-surface": "#1a1c1c",
                        "on-tertiary-container": "#fffbff",
                        "tertiary-container": "#a06900",
                        "tertiary-fixed": "#ffddb4",
                        "outline-variant": "#e4bebc",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed-variant": "#474747",
                        "secondary-container": "#e4e2e1",
                        "on-secondary": "#ffffff",
                        "on-error-container": "#93000a",
                        "secondary": "#5f5e5e",
                        "surface": "#f9f9f9",
                        "on-primary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "touch-target-min": "48px",
                        "container-margin": "20px",
                        "base": "8px",
                        "gutter": "16px",
                        "card-padding": "16px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-lg": ["Montserrat"],
                        "headline-lg-mobile": ["Montserrat"],
                        "label-md": ["Inter"],
                        "headline-xl": ["Montserrat"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                        "headline-lg": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                        "headline-lg-mobile": ["20px", {"lineHeight": "28px", "fontWeight": "700"}],
                        "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                        "headline-xl": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
<style>
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.2; }
            100% { transform: scale(0.8); opacity: 0.5; }
        }
        .spinner-pulse {
            animation: pulse-ring 2s cubic-bezier(0.45, 0, 0.55, 1) infinite;
        }
        .glass-blur {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen relative overflow-hidden">
<!-- Underlying Content Simulation (Blurred/Dimmed) -->
<div class="fixed inset-0 z-0 flex flex-col p-container-margin filter grayscale opacity-40">
<!-- TopAppBar (Simulated as per JSON but inactive) -->
<header class="flex justify-between items-center h-12 w-full mb-8">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary">directions_bus</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">TransitFood</h1>
</div>
<span class="material-symbols-outlined text-primary">location_on</span>
</header>
<!-- Mock Order Summary Content -->
<div class="space-y-gutter">
<div class="bg-surface-container-low p-card-padding rounded-xl shadow-sm">
<div class="h-4 w-1/3 bg-surface-variant rounded mb-2"></div>
<div class="h-6 w-2/3 bg-surface-variant rounded"></div>
</div>
<div class="grid grid-cols-1 gap-base">
<div class="bg-surface-container-low h-24 rounded-xl"></div>
<div class="bg-surface-container-low h-24 rounded-xl"></div>
</div>
</div>
</div>
<!-- Modal Overlay Backdrop -->
<div class="fixed inset-0 z-40 bg-inverse-surface/40 glass-blur transition-opacity duration-300"></div>
<!-- Main Timeout Modal -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-gutter">
<main class="bg-surface-container-lowest w-full max-w-md rounded-[32px] p-8 shadow-2xl flex flex-col items-center text-center relative overflow-hidden">
<!-- Animated Spinner Section -->
<div class="relative w-40 h-40 mb-8 flex items-center justify-center">
<!-- Background Pulse -->
<div class="absolute inset-0 bg-primary/10 rounded-full spinner-pulse"></div>
<!-- Main Rotating Loader -->
<div class="relative w-24 h-24">
<svg class="animate-spin w-full h-full text-primary" viewbox="0 0 100 100">
<circle class="opacity-20" cx="50" cy="50" fill="none" r="42" stroke="currentColor" stroke-width="8"></circle>
<path class="opacity-100" d="M50 8 A 42 42 0 0 1 92 50" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="8">
</path>
</svg>
<!-- Inner Icon -->
<div class="absolute inset-0 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">restaurant</span>
</div>
</div>
</div>
<!-- Text Content -->
<div class="space-y-base mb-10">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight">Sending your order...</h2>
<p class="font-body-md text-on-surface-variant max-w-[240px] mx-auto">This usually takes a few seconds</p>
</div>
<!-- Timer Display -->
<div class="bg-surface-container-low px-6 py-3 rounded-full flex items-center gap-3 mb-12">
<span class="material-symbols-outlined text-secondary text-base">schedule</span>
<span class="font-label-md text-secondary uppercase tracking-wider" id="timer-text"><span id="seconds">0</span> seconds elapsed</span>
</div>
<!-- Cancel Action -->
<button class="w-full h-touch-target-min bg-secondary-container text-on-secondary-container font-label-md rounded-full transition-all duration-200 active:scale-95 hover:bg-surface-variant flex items-center justify-center gap-2" id="cancel-btn">
<span class="material-symbols-outlined text-base">close</span>
                Cancel
            </button>
<!-- Bottom Progress Hint (Decorative) -->
<div class="mt-8 flex gap-1 w-24">
<div class="h-1 flex-1 bg-primary rounded-full"></div>
<div class="h-1 flex-1 bg-surface-variant rounded-full animate-pulse"></div>
<div class="h-1 flex-1 bg-surface-variant rounded-full"></div>
</div>
</main>
</div>
<!-- Success Feedback Notification (Hidden by default) -->
<div class="fixed bottom-10 left-1/2 -translate-x-1/2 z-[60] bg-inverse-surface text-inverse-on-surface px-6 py-4 rounded-xl shadow-lg flex items-center gap-4 opacity-0 pointer-events-none transform translate-y-10 transition-all duration-500" id="toast">
<span class="material-symbols-outlined text-primary-fixed">check_circle</span>
<span class="font-label-md">Order cancelled successfully.</span>
</div>
<script>
        // Simple timer logic
        let count = 0;
        const timerDisplay = document.getElementById('seconds');
        const interval = setInterval(() => {
            count++;
            timerDisplay.textContent = count;
            
            // Visual feedback as it takes longer
            if(count > 30) {
                document.getElementById('timer-text').classList.add('text-error');
            }
        }, 1000);

        // Cancel button interaction
        const cancelBtn = document.getElementById('cancel-btn');
        const toast = document.getElementById('toast');
        
        cancelBtn.addEventListener('click', () => {
            clearInterval(interval);
            // Simulate interaction response
            cancelBtn.innerHTML = '<svg class="animate-spin h-5 w-5 text-on-secondary-container" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Aborting...';
            
            setTimeout(() => {
                // Show toast
                toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-10');
                
                // Dim everything further as if closing
                document.querySelector('main').style.opacity = '0.5';
                document.querySelector('main').style.pointerEvents = 'none';
                
                setTimeout(() => {
                    toast.classList.add('opacity-0', 'translate-y-10');
                }, 3000);
            }, 1000);
        });
    </script>
</body></html>
