<div class="h-1 bg-primary w-16 rounded-full"></div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-gutter">
<!-- Mock items for background -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(0,0,0,0.06)] overflow-hidden">
<div class="h-48 bg-surface-container w-full"></div>

</div>
</div>
</div>
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(0,0,0,0.06)] overflow-hidden">

<h3 class="font-label-md text-label-md text-on-surface">Paneer Kulcha</h3>

</div>

<!-- MODAL OVERLAY -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay bg-on-background/60">

<div class="bg-surface-container-lowest w-full max-w-lg rounded-[24px] shadow-2xl overflow-hidden modal-card flex flex-col max-h-[90vh]">
<!-- Modal Header -->
<div class="px-6 py-5 border-b border-outline-variant flex items-center justify-between">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Edit Item</h2>
<button class="p-2 hover:bg-surface-container-high rounded-full transition-colors active:scale-95">
<span class="material-symbols-outlined text-secondary" data-icon="close">close</span>
</button>
</div>
<!-- Scrollable Content -->
<div class="overflow-y-auto px-6 py-6 hide-scrollbar">
<form class="space-y-6">
<!-- Image Upload -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant">Item Image</label>
<div class="border-2 border-dashed border-outline-variant rounded-xl p-8 flex flex-col items-center justify-center bg-surface-container-low hover:bg-surface-container-high transition-colors cursor-pointer group">
<div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center mb-3 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-primary" data-icon="upload">upload</span>
</div>
<span class="font-label-md text-label-md text-on-surface">Upload Image</span>
<span class="font-label-sm text-label-sm text-secondary mt-1">JPG, PNG or WEBP (Max. 5MB)</span>
</div>
</div>
<!-- Item Name -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant" for="item-name">Item Name</label>
<input class="w-full px-4 py-3 bg-surface-container rounded-xl border-none focus:ring-2 focus:ring-primary text-on-surface font-body-md placeholder:text-secondary/60" id="item-name" type="text" value="Paneer Kulcha"/>
</div>
<!-- Price & Prep Time Row -->
<div class="grid grid-cols-2 gap-4">
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant" for="price">Price (₹)</label>
<input class="w-full px-4 py-3 bg-surface-container rounded-xl border-none focus:ring-2 focus:ring-primary text-on-surface font-body-md" id="price" type="number" value="120"/>
</div>
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant" for="prep-time">Prep Time (mins)</label>
<div class="relative">
<input class="w-full px-4 py-3 bg-surface-container rounded-xl border-none focus:ring-2 focus:ring-primary text-on-surface font-body-md" id="prep-time" type="number" value="15"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-secondary text-lg" data-icon="timer">timer</span>
</div>
</div>
</div>
<!-- Category -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant" for="category">Category</label>
<div class="relative">
<select class="w-full px-4 py-3 bg-surface-container rounded-xl border-none focus:ring-2 focus:ring-primary text-on-surface font-body-md appearance-none" id="category">
<option selected="">Breakfast</option>
<option>Lunch</option>
<option>Snacks</option>
<option>Beverages</option>
</select>
<span class="absolute right-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-secondary pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<!-- Description -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant" for="description">Description (Optional)</label>
<textarea class="w-full px-4 py-3 bg-surface-container rounded-xl border-none focus:ring-2 focus:ring-primary text-on-surface font-body-md resize-none" id="description" rows="3">Soft leavened bread stuffed with spiced cottage cheese, served with pickles.</textarea>
</div>
</form>

<span>Save Changes</span>
<span class="material-symbols-outlined text-lg" data-icon="check_circle">check_circle</span>
</button>
<button class="w-full min-h-[48px] bg-transparent border-2 border-secondary text-secondary font-bold rounded-xl hover:bg-surface-container-highest transition-colors active:scale-[0.98] duration-150">
                    Cancel
                </button>
</div>

<span class="font-label-sm text-label-sm">Lunch</span>
</div>

<span class="material-symbols-outlined" data-icon="icecream">icecream</span>
<span class="font-label-sm text-label-sm">Snacks</span>
</div>
<div class="flex flex-col items-center justify-center text-secondary hover:bg-surface-container-highest transition-all px-4 py-1 rounded-full cursor-pointer">
<span class="material-symbols-outlined" data-icon="local_bar">local_bar</span>
<span class="font-label-sm text-label-sm">Beverages</span>
</div>
</nav>
<script>
        // Simple Interaction logic
        document.querySelectorAll('button, div[role="button"]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                if(btn.textContent.includes('Cancel') || btn.querySelector('[data-icon="close"]')) {
                    document.querySelector('.modal-overlay').style.display = 'none';
                    document.querySelector('main').classList.remove('opacity-40', 'pointer-events-none');
                }
            });
        });
    </script>
